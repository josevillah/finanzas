[package]
name = "finanzas"
version = "0.8.2"
description = "Gestor de finanzas personales"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "finanzas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
# Con la app viviendo en la bandeja, el doble clic en el acceso directo abriría
# un segundo proceso sobre la misma base. Este plugin le da el foco al que ya
# está corriendo.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `backup` da la API de respaldo en caliente de SQLite: con WAL activo, copiar
# el archivo a mano puede dejar fuera transacciones que aún viven en el -wal.
rusqlite = { version = "0.32", features = ["bundled", "chrono", "backup"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
